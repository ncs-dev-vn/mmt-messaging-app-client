# Chat Client Configuration
# Cấu hình cho client với tính năng auto-detection và network scanning

[server]
default_host = 127.0.0.1
default_port = 12345
timeout = 30
scan_timeout = 2

[client]
buffer_size = 1024
max_nickname_length = 20
max_message_length = 500
auto_reconnect = false

[moderation]
enable_content_filter = true
max_messages_per_window = 5
message_rate_window = 30
allow_inappropriate_words = false
filter_spam = true

[network]
auto_scan_enabled = true
priority_ips = 192.168.1.1,192.168.1.100,192.168.1.101,192.168.1.10
scan_range_start = 1
scan_range_end = 254

[ui]
show_timestamps = true
color_enabled = false
show_connection_menu = true